<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#0d2850"/>
      <stop offset="100%" stop-color="#1d559f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg5)"/>
  <rect x="0" y="410" width="800" height="4" fill="#f1cc11"/>
  <!-- Smart collar / IoT icon -->
  <g transform="translate(350, 170)" fill="none">
    <!-- Central chip -->
    <rect x="-40" y="-40" width="80" height="80" rx="12" fill="#0d2850" stroke="#f1cc11" stroke-width="2"/>
    <!-- Chip lines -->
    <line x1="-40" y1="-15" x2="-60" y2="-15" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <line x1="-40" y1="0" x2="-55" y2="0" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <line x1="-40" y1="15" x2="-60" y2="15" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="-15" x2="60" y2="-15" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="0" x2="55" y2="0" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <line x1="40" y1="15" x2="60" y2="15" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <line x1="-15" y1="-40" x2="-15" y2="-55" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <line x1="0" y1="-40" x2="0" y2="-60" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <line x1="15" y1="-40" x2="15" y2="-55" stroke="#f1cc11" stroke-width="2" opacity="0.5"/>
    <!-- Inner circuit -->
    <circle cx="0" cy="0" r="16" stroke="#f1cc11" stroke-width="1.5" opacity="0.6"/>
    <circle cx="0" cy="0" r="6" fill="#f1cc11" opacity="0.4"/>
    <!-- Signal waves -->
    <path d="M70 -30 Q90 0 70 30" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
    <path d="M85 -40 Q110 0 85 40" stroke="#ffffff" stroke-width="1.5" opacity="0.15"/>
    <path d="M-70 -30 Q-90 0 -70 30" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  </g>
  <!-- Data dots floating -->
  <g fill="#f1cc11" opacity="0.08">
    <circle cx="150" cy="100" r="30"/>
    <circle cx="650" cy="350" r="45"/>
    <circle cx="100" cy="350" r="20"/>
  </g>
  <!-- Category badge -->
  <rect x="520" y="40" rx="4" width="240" height="36" fill="#f1cc11" opacity="0.15"/>
  <text x="640" y="65" font-family="'Noto Nastaliq Urdu', serif" font-size="18" fill="#f1cc11" text-anchor="middle" direction="rtl">اے آئی اپڈیٹ</text>
  <!-- Brand -->
  <text x="60" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" opacity="0.5">Urdu</text>
  <text x="104" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#f1cc11" opacity="0.5">Ai</text>
</svg>