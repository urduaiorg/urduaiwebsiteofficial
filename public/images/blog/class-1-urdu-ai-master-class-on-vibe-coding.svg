<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg4" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d559f"/>
      <stop offset="100%" stop-color="#0d2850"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg4)"/>
  <rect x="0" y="410" width="800" height="4" fill="#f1cc11"/>
  <!-- Rocket / launch icon -->
  <g transform="translate(360, 180)" fill="none">
    <!-- Rocket body -->
    <path d="M0-80 C-20-40 -20 40 0 80 C20 40 20-40 0-80z" fill="#ffffff" opacity="0.1" stroke="#ffffff" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Rocket nose -->
    <path d="M0-80 C-8-60 8-60 0-80z" fill="#f1cc11" opacity="0.6"/>
    <!-- Rocket window -->
    <circle cx="0" cy="-30" r="12" fill="#1d559f" stroke="#f1cc11" stroke-width="2"/>
    <circle cx="0" cy="-30" r="6" fill="#f1cc11" opacity="0.3"/>
    <!-- Fins -->
    <path d="M-20 40 L-40 70 L-20 60z" fill="#f1cc11" opacity="0.3"/>
    <path d="M20 40 L40 70 L20 60z" fill="#f1cc11" opacity="0.3"/>
    <!-- Flame -->
    <path d="M-10 80 Q0 120 10 80" fill="#f1cc11" opacity="0.5"/>
    <path d="M-6 80 Q0 105 6 80" fill="#ffffff" opacity="0.3"/>
    <!-- Trail particles -->
    <g fill="#f1cc11" opacity="0.2">
      <circle cx="-15" cy="130" r="4"/>
      <circle cx="10" cy="145" r="3"/>
      <circle cx="-5" cy="160" r="5"/>
      <circle cx="18" cy="170" r="3"/>
    </g>
  </g>
  <!-- Stars -->
  <g fill="#f1cc11" opacity="0.15">
    <path d="M120 80 l3-9 3 9 9 3-9 3-3 9-3-9-9-3z"/>
    <path d="M650 140 l4-12 4 12 12 4-12 4-4 12-4-12-12-4z"/>
    <path d="M200 320 l2-6 2 6 6 2-6 2-2 6-2-6-6-2z"/>
    <path d="M580 300 l3-9 3 9 9 3-9 3-3 9-3-9-9-3z"/>
  </g>
  <!-- Category badge -->
  <rect x="520" y="40" rx="4" width="240" height="36" fill="#f1cc11" opacity="0.15"/>
  <text x="640" y="65" font-family="'Noto Nastaliq Urdu', serif" font-size="18" fill="#f1cc11" text-anchor="middle" direction="rtl">ماسٹر کلاس</text>
  <!-- Class number -->
  <text x="100" y="380" font-family="Inter, sans-serif" font-size="72" font-weight="800" fill="#ffffff" text-anchor="middle" opacity="0.05">#01</text>
  <!-- Brand -->
  <text x="60" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" opacity="0.5">Urdu</text>
  <text x="104" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#f1cc11" opacity="0.5">Ai</text>
</svg>