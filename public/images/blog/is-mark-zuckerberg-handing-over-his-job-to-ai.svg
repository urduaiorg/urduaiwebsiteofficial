<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153d75"/>
      <stop offset="100%" stop-color="#1d559f"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg1)"/>
  <!-- Geometric accent -->
  <circle cx="700" cy="80" r="180" fill="#f1cc11" opacity="0.06"/>
  <circle cx="650" cy="120" r="100" fill="#f1cc11" opacity="0.04"/>
  <rect x="0" y="410" width="800" height="4" fill="#f1cc11"/>
  <!-- Grid dots pattern -->
  <g fill="#ffffff" opacity="0.04">
    <circle cx="60" cy="60" r="3"/><circle cx="120" cy="60" r="3"/><circle cx="180" cy="60" r="3"/><circle cx="240" cy="60" r="3"/>
    <circle cx="60" cy="120" r="3"/><circle cx="120" cy="120" r="3"/><circle cx="180" cy="120" r="3"/><circle cx="240" cy="120" r="3"/>
    <circle cx="60" cy="180" r="3"/><circle cx="120" cy="180" r="3"/><circle cx="180" cy="180" r="3"/><circle cx="240" cy="180" r="3"/>
  </g>
  <!-- AI circuit lines -->
  <g stroke="#f1cc11" stroke-width="1.5" opacity="0.12" fill="none">
    <path d="M600 350 L700 350 L700 250"/>
    <path d="M620 380 L720 380 L720 300"/>
    <circle cx="600" cy="350" r="4" fill="#f1cc11"/>
    <circle cx="700" cy="250" r="4" fill="#f1cc11"/>
  </g>
  <!-- Category badge -->
  <rect x="520" y="40" rx="4" width="240" height="36" fill="#f1cc11" opacity="0.15"/>
  <text x="640" y="65" font-family="'Noto Nastaliq Urdu', serif" font-size="18" fill="#f1cc11" text-anchor="middle" direction="rtl">اے آئی اپڈیٹ</text>
  <!-- Brand mark -->
  <text x="60" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" opacity="0.5">Urdu</text>
  <text x="104" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#f1cc11" opacity="0.5">Ai</text>
  <!-- Icon: person + AI -->
  <g transform="translate(340, 140)" fill="none" stroke="#f1cc11" stroke-width="2.5">
    <circle cx="0" cy="0" r="24"/>
    <circle cx="0" cy="-8" r="8" fill="#f1cc11" opacity="0.3"/>
    <path d="M-16 16 Q0 28 16 16"/>
    <path d="M40 -10 L80 -10 M60 -30 L60 10" stroke="#ffffff" stroke-width="2"/>
    <rect x="44" y="-26" width="32" height="32" rx="6" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="55" cy="-14" r="3" fill="#f1cc11"/>
    <circle cx="69" cy="-6" r="3" fill="#f1cc11"/>
    <path d="M30 0 L40 -4" stroke="#f1cc11" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>
</svg>