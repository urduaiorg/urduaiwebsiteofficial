<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#1d559f"/>
      <stop offset="100%" stop-color="#153d75"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg2)"/>
  <rect x="0" y="410" width="800" height="4" fill="#f1cc11"/>
  <!-- Code window -->
  <g transform="translate(240, 80)">
    <rect x="0" y="0" width="320" height="220" rx="12" fill="#0d2850" stroke="#f1cc11" stroke-width="1.5" opacity="0.9"/>
    <!-- Window dots -->
    <circle cx="24" cy="20" r="5" fill="#ff5f57"/>
    <circle cx="44" cy="20" r="5" fill="#febc2e"/>
    <circle cx="64" cy="20" r="5" fill="#28c840"/>
    <!-- Code lines -->
    <rect x="24" y="48" width="120" height="8" rx="4" fill="#f1cc11" opacity="0.6"/>
    <rect x="24" y="68" width="200" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="40" y="88" width="160" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
    <rect x="40" y="108" width="180" height="8" rx="4" fill="#f1cc11" opacity="0.3"/>
    <rect x="24" y="128" width="140" height="8" rx="4" fill="#ffffff" opacity="0.2"/>
    <rect x="24" y="148" width="100" height="8" rx="4" fill="#f1cc11" opacity="0.4"/>
    <rect x="40" y="168" width="220" height="8" rx="4" fill="#ffffff" opacity="0.12"/>
    <rect x="24" y="188" width="80" height="8" rx="4" fill="#f1cc11" opacity="0.25"/>
  </g>
  <!-- Sparkle accents -->
  <g fill="#f1cc11" opacity="0.5">
    <path d="M180 160 l4-12 4 12 12 4-12 4-4 12-4-12-12-4z"/>
    <path d="M620 120 l3-9 3 9 9 3-9 3-3 9-3-9-9-3z"/>
    <path d="M160 300 l2-6 2 6 6 2-6 2-2 6-2-6-6-2z"/>
  </g>
  <!-- Category badge -->
  <rect x="520" y="40" rx="4" width="240" height="36" fill="#f1cc11" opacity="0.15"/>
  <text x="640" y="65" font-family="'Noto Nastaliq Urdu', serif" font-size="18" fill="#f1cc11" text-anchor="middle" direction="rtl">ماسٹر کلاس</text>
  <!-- Class number -->
  <text x="400" y="380" font-family="Inter, sans-serif" font-size="48" font-weight="800" fill="#ffffff" text-anchor="middle" opacity="0.08">#02</text>
  <!-- Brand -->
  <text x="60" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" opacity="0.5">Urdu</text>
  <text x="104" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#f1cc11" opacity="0.5">Ai</text>
