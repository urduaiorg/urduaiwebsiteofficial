<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg3" x1="0.2" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#153d75"/>
      <stop offset="60%" stop-color="#1d559f"/>
      <stop offset="100%" stop-color="#2968b8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg3)"/>
  <rect x="0" y="410" width="800" height="4" fill="#f1cc11"/>
  <!-- School building icon -->
  <g transform="translate(300, 90)" fill="none" stroke="#ffffff" stroke-width="2">
    <!-- Building body -->
    <rect x="0" y="60" width="200" height="160" rx="4" stroke-opacity="0.3" fill="#0d2850" fill-opacity="0.5"/>
    <!-- Roof -->
    <path d="M-10 60 L100 10 L210 60" stroke="#f1cc11" stroke-width="2.5"/>
    <!-- Door -->
    <rect x="75" y="150" width="50" height="70" rx="25" stroke="#f1cc11" stroke-width="2"/>
    <!-- Windows -->
    <rect x="20" y="85" width="40" height="35" rx="3" stroke-opacity="0.4" fill="#f1cc11" fill-opacity="0.1"/>
    <rect x="140" y="85" width="40" height="35" rx="3" stroke-opacity="0.4" fill="#f1cc11" fill-opacity="0.1"/>
    <!-- Flag -->
    <line x1="100" y1="10" x2="100" y2="-20" stroke="#f1cc11" stroke-width="2"/>
    <path d="M100 -20 L130 -12 L100 -4" fill="#f1cc11" opacity="0.6"/>
    <!-- AI circuit from building -->
    <g stroke="#f1cc11" stroke-width="1.5" opacity="0.3">
      <path d="M210 100 L260 100 L260 160 L300 160"/>
      <path d="M210 140 L240 140 L240 200 L280 200"/>
      <circle cx="300" cy="160" r="5" fill="#f1cc11"/>
      <circle cx="280" cy="200" r="5" fill="#f1cc11"/>
    </g>
  </g>
  <!-- Pakistan star -->
  <g transform="translate(660, 100)" fill="#f1cc11" opacity="0.12">
    <path d="M0-20 L5-6 18-6 8 3 12 18 0 10-12 18-8 3-18-6-5-6z"/>
  </g>
  <!-- Category badge -->
  <rect x="520" y="40" rx="4" width="240" height="36" fill="#f1cc11" opacity="0.15"/>
  <text x="640" y="65" font-family="'Noto Nastaliq Urdu', serif" font-size="18" fill="#f1cc11" text-anchor="middle" direction="rtl">اے آئی اپڈیٹ</text>
  <!-- Brand -->
  <text x="60" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#ffffff" opacity="0.5">Urdu</text>
  <text x="104" y="420" font-family="Inter, sans-serif" font-size="16" font-weight="800" fill="#f1cc11" opacity="0.5">Ai</text>
</svg>