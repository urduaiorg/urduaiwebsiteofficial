<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, height=630">
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Noto Nastaliq Urdu', serif;
  }

  .cover {
    width: 1200px;
    height: 630px;
    background: linear-gradient(145deg, #142444 0%, #1d559f 55%, #1a3a6e 100%);
    position: relative;
    display: flex;
    direction: ltr;
    overflow: hidden;
  }

  /* Background texture */
  .cover::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(circle at 85% 15%, rgba(241,204,17,0.06) 0%, transparent 40%),
      radial-gradient(circle at 10% 90%, rgba(241,204,17,0.04) 0%, transparent 35%);
    z-index: 1;
  }

  /* ===== LEFT SIDE — visuals ===== */
  .left-side {
    position: relative;
    z-index: 2;
    width: 45%;
    padding: 28px 20px 28px 35px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  /* Top-left: category + subtitle */
  .left-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .category-badge {
    background: rgba(241, 204, 17, 0.15);
    border: 1px solid rgba(241, 204, 17, 0.4);
    color: #f1cc11;
    font-size: 13px;
    padding: 4px 16px;
    border-radius: 16px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 600;
    letter-spacing: 0.5px;
  }

  .tech-labels {
    display: flex;
    gap: 8px;
  }

  .tech-label {
    font-size: 12px;
    color: rgba(255,255,255,0.5);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 500;
    padding: 4px 10px;
    background: rgba(255,255,255,0.08);
    border-radius: 10px;
  }

  /* Center: main image */
  .image-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px 0;
  }

  .ref-image {
    width: 100%;
    max-height: 320px;
    object-fit: contain;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.08);
  }

  /* Bottom-left: social + feature tags */
  .left-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .social-strip {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .social-icon {
    width: 18px;
    height: 18px;
    fill: rgba(255,255,255,0.45);
  }

  .social-handle {
    font-size: 12px;
    color: rgba(255,255,255,0.35);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .feature-tags {
    display: flex;
    gap: 8px;
  }

  .feature-tag {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.8);
    font-size: 11px;
    padding: 4px 12px;
    border-radius: 12px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight: 500;
  }

  .feature-tag.accent {
    background: rgba(241, 204, 17, 0.15);
    border-color: rgba(241, 204, 17, 0.35);
    color: #f1cc11;
  }

  /* ===== SEPARATOR ===== */
  .separator {
    position: absolute;
    left: 45%;
    top: 50px;
    bottom: 50px;
    width: 1px;
    background: linear-gradient(to bottom, transparent, rgba(241,204,17,0.25), transparent);
    z-index: 2;
  }

  /* ===== RIGHT SIDE — text content ===== */
  .right-side {
    position: relative;
    z-index: 2;
    width: 55%;
    padding: 28px 40px 28px 35px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    direction: rtl;
  }

  /* Top-right: branding */
  .right-top {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }

  .brand-text {
    font-size: 32px;
    font-weight: 700;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    line-height: 1.2;
  }

  .brand-text span {
    color: #f1cc11;
  }

  .brand-url {
    font-size: 13px;
    color: rgba(255,255,255,0.4);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    direction: ltr;
  }

  /* Center: headline */
  .headline-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
  }

  .headline {
    font-size: 40px;
    font-weight: 700;
    color: #ffffff;
    line-height: 2.1;
    text-shadow: 0 2px 10px rgba(0,0,0,0.25);
  }

  .headline .highlight {
    color: #f1cc11;
  }

  .sub-headline {
    font-size: 18px;
    color: rgba(255,255,255,0.7);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    direction: ltr;
    text-align: right;
    letter-spacing: 0.5px;
  }

  .sub-headline span {
    color: #f1cc11;
    font-weight: 600;
  }

  /* Bottom-right: free badge + url */
  .right-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .free-badge {
    background: linear-gradient(135deg, #f1cc11, #dbb510);
    color: #1a2744;
    font-size: 16px;
    font-weight: 700;
    padding: 8px 22px;
    border-radius: 8px;
    font-family: 'Noto Nastaliq Urdu', serif;
    line-height: 1.8;
    box-shadow: 0 4px 16px rgba(241,204,17,0.25);
  }

  .date-label {
    font-size: 13px;
    color: rgba(255,255,255,0.35);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    direction: ltr;
  }

  /* Decorative dots */
  .deco-dots {
    position: absolute;
    z-index: 1;
    opacity: 0.04;
  }

  .deco-dots.top-left {
    top: 15px;
    left: 15px;
    width: 80px;
    height: 80px;
    background-image: radial-gradient(circle, #f1cc11 1.5px, transparent 1.5px);
    background-size: 12px 12px;
  }

  .deco-dots.bottom-right {
    bottom: 15px;
    right: 15px;
    width: 60px;
    height: 60px;
    background-image: radial-gradient(circle, #f1cc11 1.5px, transparent 1.5px);
    background-size: 12px 12px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="deco-dots top-left"></div>
  <div class="deco-dots bottom-right"></div>
  <div class="separator"></div>

  <!-- LEFT SIDE -->
  <div class="left-side">
    <div class="left-top">
      <span class="category-badge">Google Vids</span>
      <div class="tech-labels">
        <span class="tech-label">April 2026</span>
      </div>
    </div>

    <div class="image-container">
      <img src="/images/google-vids-ref.webp" alt="Google Vids Interface" class="ref-image" />
    </div>

    <div class="left-bottom">
      <div class="social-strip">

        <svg class="social-icon" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        <svg class="social-icon" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
        <svg class="social-icon" viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 00-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 00.502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 002.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 002.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
        <span class="social-handle">@urduaiorg</span>
      </div>
      <div class="feature-tags">
        <span class="feature-tag accent">Veo 3.1</span>
        <span class="feature-tag accent">Lyria 3</span>
        <span class="feature-tag">Avatars</span>
      </div>
    </div>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right-side">
    <div class="right-top">
      <div class="brand-text">Urdu <span>Ai</span></div>
      <div class="brand-url">www.urduai.org</div>
    </div>

    <div class="headline-area">
      <h1 class="headline">
        گوگل وِڈز میں <span class="highlight">مفت</span> AI ویڈیو، میوزک اور اوتار
      </h1>
      <div class="sub-headline">
        <span>Veo 3.1</span> &nbsp;&bull;&nbsp; <span>Lyria 3</span> &nbsp;&bull;&nbsp; <span>Custom Avatars</span>
      </div>
    </div>

    <div class="right-bottom">
      <div class="free-badge">ماہانہ 10 مفت ویڈیوز</div>
      <div class="date-label">April 5, 2026</div>
    </div>
  </div>
</div>
</body>
</html>
