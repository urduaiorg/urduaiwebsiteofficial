<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Urdu Ai — 360° Viewer</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-0: #0a1525;
    --navy-1: #0f2340;
    --brand-navy: #1d559f;
    --brand-yellow: #f1cc11;
    --muted: #a8c0d8;
  }
  html, body { margin: 0; height: 100%; background: var(--navy-0); overflow: hidden;
               font-family: Montserrat, -apple-system, system-ui, sans-serif; color: #fff; }
  #canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }

  /* Drop screen */
  #drop {
    position: fixed; inset: 0; z-index: 10;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #0f2340 0%, #0a1525 70%);
    transition: opacity .2s;
    padding: 20px;
  }
  #drop.hidden { opacity: 0; pointer-events: none; }
  #drop .box {
    border: 2px dashed #2a3f60; border-radius: 16px;
    padding: 40px 36px; text-align: center;
    background: rgba(15,35,64,0.4);
    max-width: 480px; width: 100%;
  }
  #drop.over .box { border-color: var(--brand-yellow); background: rgba(241,204,17,0.08); }
  #drop h1 { margin: 0 0 8px; font-size: 26px; font-weight: 900; letter-spacing: -0.2px; }
  #drop h1 .urdu { color: #ffffff; }
  #drop h1 .ai { color: var(--brand-yellow); }
  #drop h1 .sep { color: var(--muted); font-weight: 500; margin: 0 10px; }
  #drop h1 .tail { color: #ffffff; font-weight: 700; }
  #drop .sub { margin: 0 0 22px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  label.btn {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    background: var(--brand-yellow); color: #111; font-weight: 800; cursor: pointer;
    font-size: 14px;
  }
  label.btn:hover { filter: brightness(1.08); }
  input[type=file] { display: none; }
  #drop .warn {
    margin-top: 16px; padding: 10px 14px; border-radius: 8px;
    background: rgba(241,204,17,0.08); border: 1px solid rgba(241,204,17,0.25);
    color: #fff; font-size: 12px; line-height: 1.5; display: none;
  }
  #drop .warn.show { display: block; }

  /* HUD */
  #hud {
    position: fixed; top: 14px; left: 14px; right: 14px; z-index: 5;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 8px;
    pointer-events: none;
  }
  #hud > * { pointer-events: auto; }
  .hud-group {
    display: flex; gap: 6px; align-items: center;
    background: rgba(10,21,37,0.65); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.08); border-radius: 10px; padding: 6px;
    flex-wrap: wrap;
  }
  .hud-group button, .hud-group label.mini, .hud-group select {
    padding: 7px 11px; border-radius: 7px; border: none;
    background: transparent; color: #fff; cursor: pointer; font-size: 12px;
    font-family: inherit; font-weight: 500;
  }
  .hud-group button:hover, .hud-group label.mini:hover { background: rgba(255,255,255,0.08); }
  .hud-group button.primary { background: var(--brand-yellow); color: #111; font-weight: 800; }
  .hud-group button.primary:hover { filter: brightness(1.08); background: var(--brand-yellow); }
  .hud-group button.danger { background: #c0392b; color: #fff; font-weight: 700; }
  .hud-group button:disabled { opacity: 0.4; cursor: not-allowed; }
  .hud-group select { background: rgba(255,255,255,0.06); }
  .hud-group .divider { width: 1px; height: 18px; background: rgba(255,255,255,0.12); margin: 0 2px; }

  /* Brand pill (live, subtle) */
  #brand-live {
    position: fixed; bottom: 14px; right: 14px; z-index: 5;
    padding: 8px 14px; border-radius: 999px;
    background: rgba(29,85,159,0.92); backdrop-filter: blur(10px);
    border: 1px solid rgba(241,204,17,0.35);
    font-size: 13px; color: rgba(255,255,255,0.85);
    font-weight: 500;
  }
  #brand-live .urdu { color: #ffffff; font-weight: 900; letter-spacing: -0.2px; }
  #brand-live .ai { color: var(--brand-yellow); font-weight: 900; letter-spacing: -0.2px; }
  #brand-live .sep { opacity: 0.55; margin: 0 8px; }

  #hint { position: fixed; bottom: 14px; left: 14px; z-index: 5;
          font-size: 12px; color: rgba(255,255,255,0.45); pointer-events: none; }

  /* Recording overlay */
  #rec-overlay {
    position: fixed; inset: 0; z-index: 20;
    display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.55); backdrop-filter: blur(4px);
    padding: 20px;
  }
  #rec-overlay.active { display: flex; }
  #rec-panel {
    background: linear-gradient(180deg, var(--brand-navy), #0a1525);
    border: 1px solid rgba(241,204,17,0.35); border-radius: 16px;
    padding: 28px 36px; min-width: 280px; max-width: 380px; text-align: center;
  }
  #rec-panel .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #e74c3c; margin-right: 8px; vertical-align: middle;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.3); } }
  #rec-panel h2 { margin: 0 0 6px; color: var(--brand-yellow); font-size: 16px; font-weight: 800; }
  #rec-panel p { margin: 0 0 14px; color: var(--muted); font-size: 12px; }
  #rec-bar { height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  #rec-bar > div { height: 100%; background: var(--brand-yellow); width: 0%; transition: width 0.1s linear; }
  #rec-cancel { margin-top: 16px; padding: 8px 16px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
                background: transparent; color: #fff; cursor: pointer; font-family: inherit; font-size: 12px; }

  /* Manual record indicator */
  #rec-indicator {
    position: fixed; top: 70px; right: 14px; z-index: 6;
    display: none; align-items: center; gap: 6px;
    padding: 6px 12px; border-radius: 999px;
    background: rgba(231,76,60,0.9); font-size: 12px; font-weight: 600;
  }
  #rec-indicator.active { display: flex; }
  #rec-indicator .dot { width: 8px; height: 8px; border-radius: 50%; background: #fff;
                        animation: pulse 1.2s ease-in-out infinite; }

  /* Mobile-specific HUD compaction */
  @media (max-width: 640px) {
    .hud-group button, .hud-group label.mini, .hud-group select { padding: 6px 8px; font-size: 11px; }
    #drop h1 { font-size: 22px; }
    #drop h1 .sep { display: none; }
    #drop h1 .tail { display: block; font-size: 16px; margin-top: 4px; font-weight: 500; color: var(--muted); }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="hud" style="display:none">
  <div class="hud-group">
    <label class="mini" for="pick2">Open image</label>
    <input id="pick2" type="file" accept="image/*" />
    <div class="divider"></div>
    <button id="reset" title="Reset view (R)">Reset</button>
    <button id="autospin" title="Auto-spin (Space)">Auto-spin</button>
    <button id="fs" title="Fullscreen">Fullscreen</button>
  </div>
  <div class="hud-group">
    <select id="rec-duration" title="Pan duration">
      <option value="8">8s pan</option>
      <option value="15" selected>15s pan</option>
      <option value="30">30s pan</option>
    </select>
    <select id="rec-resolution" title="Export resolution">
      <option value="1280x720">720p</option>
      <option value="1920x1080">1080p</option>
      <option value="2560x1440">1440p</option>
    </select>
    <div class="divider"></div>
    <button id="rec-pan" class="primary" title="Record auto 360° pan">Record 360° pan</button>
    <button id="rec-manual" title="Start/stop manual recording (M)">Manual rec</button>
    <button id="snap-fallback" title="Download current view as PNG" style="display:none;">Save PNG</button>
  </div>
</div>

<div id="rec-indicator"><span class="dot"></span><span id="rec-indicator-text">REC 0:00</span></div>

<div id="brand-live" style="display:none">
  <span class="urdu">Urdu</span> <span class="ai">Ai</span><span class="sep">·</span>@urduaiorg
</div>

<div id="hint" style="display:none">drag to look · scroll to zoom · space to spin</div>

<div id="rec-overlay">
  <div id="rec-panel">
    <h2><span class="dot"></span>Recording 360° pan…</h2>
    <p id="rec-status">Preparing</p>
    <div id="rec-bar"><div></div></div>
    <button id="rec-cancel">Cancel</button>
  </div>
</div>

<div id="drop">
  <div class="box">
    <h1><span class="urdu">Urdu</span> <span class="ai">Ai</span><span class="sep">·</span><span class="tail">360° Viewer</span></h1>
    <p class="sub">Drop an equirectangular image (2:1) here, or choose one below.<br>Works best with 360° images generated by ChatGPT, Skybox AI or similar tools.</p>
    <label class="btn" for="pick">Choose image</label>
    <input id="pick" type="file" accept="image/*" />
    <div class="warn" id="compat-warn"></div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "/vendor/three/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

// ---------- Capability detection ----------
const ua = navigator.userAgent;
const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
const isAndroid = /Android/.test(ua);
const isMobile = isIOS || isAndroid || window.matchMedia('(max-width: 820px)').matches;
const hasMediaRecorder = typeof window.MediaRecorder !== 'undefined';
const canCaptureStream = typeof HTMLCanvasElement.prototype.captureStream === 'function';
const canRecord = hasMediaRecorder && canCaptureStream;

// Surface compatibility info in the drop screen
(() => {
  const warn = document.getElementById('compat-warn');
  const msgs = [];
  if (isIOS) msgs.push('On iPhone / iPad, MP4 recording is unreliable — you can still view and share a still PNG frame.');
  else if (!canRecord) msgs.push('Your browser does not support video recording. You can still view and download a still PNG frame.');
  else if (isMobile) msgs.push('On mobile, 720p recording is recommended.');
  if (msgs.length) {
    warn.innerHTML = msgs.join('<br>');
    warn.classList.add('show');
  }
})();

// Default mobile resolution to 720p
if (isMobile) {
  const resSel = document.getElementById('rec-resolution');
  if (resSel) resSel.value = '1280x720';
}

// Disable record buttons if unsupported; show PNG fallback instead
if (!canRecord) {
  const recPan = document.getElementById('rec-pan');
  const recManual = document.getElementById('rec-manual');
  const snapBtn = document.getElementById('snap-fallback');
  if (recPan) recPan.disabled = true;
  if (recManual) recManual.disabled = true;
  if (snapBtn) snapBtn.style.display = 'inline-block';
}

// ---------- Elements ----------
const canvas = document.getElementById('canvas');
const dropEl = document.getElementById('drop');
const hud = document.getElementById('hud');
const hint = document.getElementById('hint');
const brandLive = document.getElementById('brand-live');
const recOverlay = document.getElementById('rec-overlay');
const recStatus = document.getElementById('rec-status');
const recBar = document.querySelector('#rec-bar > div');
const recIndicator = document.getElementById('rec-indicator');
const recIndicatorText = document.getElementById('rec-indicator-text');

// ---------- Three.js ----------
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, 1, 0.1, 1100);
camera.position.set(0, 0, 0.01);

const geometry = new THREE.SphereGeometry(500, 96, 64);
geometry.scale(-1, 1, 1);
let mesh = null;

function resizeToWindow() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', () => { if (!recording) resizeToWindow(); });
resizeToWindow();

// ---------- View state ----------
let lon = 0, lat = 0, fov = 75;
let targetLon = 0, targetLat = 0, targetFov = 75;
let autoSpin = false;
let recording = false;

function applyAngles() {
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  const x = 500 * Math.sin(phi) * Math.cos(theta);
  const y = 500 * Math.cos(phi);
  const z = 500 * Math.sin(phi) * Math.sin(theta);
  camera.lookAt(x, y, z);
}

function tickSmoothed() {
  lon += (targetLon - lon) * 0.12;
  lat += (targetLat - lat) * 0.12;
  fov += (targetFov - fov) * 0.15;
  if (autoSpin) targetLon += 0.08;
  if (Math.abs(fov - camera.fov) > 0.001) { camera.fov = fov; camera.updateProjectionMatrix(); }
  applyAngles();
}

function animate() {
  requestAnimationFrame(animate);
  if (recording) return;
  tickSmoothed();
  renderer.render(scene, camera);
}
animate();

// ---------- Input ----------
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener('mousedown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.classList.add('dragging'); });
window.addEventListener('mouseup',   () => { dragging = false; canvas.classList.remove('dragging'); });
window.addEventListener('mousemove', e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  targetLon -= dx * 0.15;
  targetLat += dy * 0.15;
  targetLat = Math.max(-85, Math.min(85, targetLat));
});
canvas.addEventListener('touchstart', e => {
  if (e.touches.length !== 1) return;
  dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
canvas.addEventListener('touchmove', e => {
  if (!dragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  targetLon -= dx * 0.2;
  targetLat += dy * 0.2;
  targetLat = Math.max(-85, Math.min(85, targetLat));
}, { passive: true });
canvas.addEventListener('touchend', () => { dragging = false; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  targetFov += e.deltaY * 0.05;
  targetFov = Math.max(25, Math.min(100, targetFov));
}, { passive: false });

// ---------- Image loading ----------
function showLoadError(msg) {
  const warn = document.getElementById('compat-warn');
  if (warn) {
    warn.innerHTML = msg;
    warn.classList.add('show');
  } else {
    alert(msg);
  }
}

function loadImageElement(url) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      if (!img.naturalWidth || !img.naturalHeight) {
        reject(new Error('Image has zero dimensions — the file may be corrupt.'));
        return;
      }
      resolve(img);
    };
    img.onerror = () => reject(new Error('Browser could not decode this image. Try a JPG or PNG.'));
    img.src = url;
  });
}

async function loadImage(fileOrUrl) {
  const objectUrl = (fileOrUrl instanceof File || fileOrUrl instanceof Blob)
    ? URL.createObjectURL(fileOrUrl) : null;
  const url = objectUrl ?? fileOrUrl;

  try {
    const img = await loadImageElement(url);

    // Cap to the device's max WebGL texture size. Mobile GPUs can be 4096;
    // ChatGPT 360° images are often 4096x2048 or larger.
    const maxTex = renderer.capabilities.maxTextureSize || 4096;
    // Leave headroom — many mobile drivers report maxTex but fail near it.
    const cap = Math.min(maxTex, 4096);

    let source = img;
    if (img.naturalWidth > cap || img.naturalHeight > cap) {
      const scale = Math.min(cap / img.naturalWidth, cap / img.naturalHeight);
      const cw = Math.max(2, Math.round(img.naturalWidth * scale));
      const ch = Math.max(2, Math.round(img.naturalHeight * scale));
      const c = document.createElement('canvas');
      c.width = cw; c.height = ch;
      const cctx = c.getContext('2d');
      cctx.drawImage(img, 0, 0, cw, ch);
      source = c;
    }

    const texture = source instanceof HTMLCanvasElement
      ? new THREE.CanvasTexture(source)
      : new THREE.Texture(source);
    texture.colorSpace = THREE.SRGBColorSpace;
    texture.minFilter = THREE.LinearFilter;
    texture.generateMipmaps = false;
    texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
    texture.needsUpdate = true;

    if (mesh) {
      mesh.material.map?.dispose();
      mesh.material.dispose();
      scene.remove(mesh);
    }
    const mat = new THREE.MeshBasicMaterial({ map: texture });
    mesh = new THREE.Mesh(geometry, mat);
    scene.add(mesh);

    dropEl.classList.add('hidden');
    hud.style.display = 'flex';
    hint.style.display = 'block';
    brandLive.style.display = 'block';

    targetLon = 0; targetLat = 0; targetFov = 75;
    lon = 0; lat = 0; fov = 75;
  } catch (err) {
    console.error('loadImage failed:', err, fileOrUrl);
    const detail = err?.message || 'Unknown error';
    const hint = (fileOrUrl && fileOrUrl.type)
      ? `<br><small style="opacity:0.75">File: ${fileOrUrl.name || 'unknown'} (${fileOrUrl.type}, ${Math.round((fileOrUrl.size || 0) / 1024)} KB)</small>`
      : '';
    showLoadError(`Could not load image: ${detail}${hint}<br><small style="opacity:0.75">Use a 2:1 equirectangular JPG or PNG.</small>`);
  } finally {
    if (objectUrl) setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
  }
}

document.getElementById('pick').addEventListener('change', e => { const f = e.target.files?.[0]; if (f) loadImage(f); });
document.getElementById('pick2').addEventListener('change', e => { const f = e.target.files?.[0]; if (f) loadImage(f); });

window.addEventListener('dragover', e => { e.preventDefault(); if (!mesh) { dropEl.classList.add('over'); dropEl.classList.remove('hidden'); } });
window.addEventListener('dragleave', e => { if (e.target === dropEl) dropEl.classList.remove('over'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  dropEl.classList.remove('over');
  const f = e.dataTransfer.files?.[0];
  if (f && f.type.startsWith('image/')) loadImage(f);
});

// ---------- HUD buttons ----------
document.getElementById('reset').addEventListener('click', () => { targetLon = 0; targetLat = 0; targetFov = 75; });
document.getElementById('fs').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen();
  else document.exitFullscreen();
});
const spinBtn = document.getElementById('autospin');
spinBtn.addEventListener('click', () => {
  autoSpin = !autoSpin;
  spinBtn.textContent = autoSpin ? 'Stop spin' : 'Auto-spin';
});
window.addEventListener('keydown', e => {
  if (recording) return;
  if (e.code === 'Space') { autoSpin = !autoSpin; spinBtn.textContent = autoSpin ? 'Stop spin' : 'Auto-spin'; e.preventDefault(); }
  if (e.key === 'r' || e.key === 'R') { targetLon = 0; targetLat = 0; targetFov = 75; }
  if (e.key === 'm' || e.key === 'M') { toggleManualRecording(); }
});

// ---------- Watermark ----------
function drawWatermark(ctx, W, H) {
  const scale = H / 1080;
  const fontMain = Math.round(42 * scale);
  const margin = Math.round(28 * scale);

  const montserrat = 'Montserrat, -apple-system, sans-serif';

  ctx.save();

  ctx.font = `900 ${fontMain}px ${montserrat}`;
  ctx.textBaseline = 'alphabetic';

  const urduText = 'Urdu';
  const aiText = 'Ai';
  const spaceW = ctx.measureText(' ').width;
  const urduW = ctx.measureText(urduText).width;
  const aiW = ctx.measureText(aiText).width;
  const wordmarkW = urduW + spaceW + aiW;

  const x = W - wordmarkW - margin;
  const y = H - margin;

  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 18 * scale;
  ctx.shadowOffsetY = 2 * scale;

  ctx.fillStyle = '#ffffff';
  ctx.fillText(urduText, x, y);

  ctx.fillStyle = '#f1cc11';
  ctx.fillText(aiText, x + urduW + spaceW, y);

  ctx.restore();
}

// ---------- Recording ----------
function pickMimeType() {
  if (!window.MediaRecorder) return '';
  const candidates = [
    'video/mp4;codecs=avc1.42E01F,mp4a.40.2',
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm',
  ];
  return candidates.find(m => window.MediaRecorder.isTypeSupported(m)) || '';
}

function easeInOutCubic(x) { return x < 0.5 ? 4*x*x*x : 1 - Math.pow(-2*x + 2, 3) / 2; }

function parseRes(v) { const [w,h] = v.split('x').map(Number); return { w, h }; }

async function ensureFontReady() {
  if (!document.fonts) return;
  try {
    await Promise.all([
      document.fonts.load('900 38px Montserrat'),
      document.fonts.load('900 42px Montserrat'),
    ]);
    await document.fonts.ready;
  } catch {}
}

function downloadBlob(blob, ext) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `urdu-ai-360-${Date.now()}.${ext}`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// PNG still-frame fallback — works everywhere, always
async function saveStillPng() {
  if (!mesh) return;
  const { w, h } = parseRes(document.getElementById('rec-resolution').value);
  await ensureFontReady();

  const prevPixelRatio = renderer.getPixelRatio();
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  tickSmoothed();
  renderer.render(scene, camera);

  const comp = document.createElement('canvas');
  comp.width = w; comp.height = h;
  const cctx = comp.getContext('2d');
  cctx.drawImage(renderer.domElement, 0, 0, w, h);
  drawWatermark(cctx, w, h);

  comp.toBlob(blob => {
    if (blob) downloadBlob(blob, 'png');
  }, 'image/png');

  renderer.setPixelRatio(prevPixelRatio);
  resizeToWindow();
}

document.getElementById('snap-fallback').addEventListener('click', saveStillPng);

async function recordPan() {
  if (recording || !mesh || !canRecord) return;
  const duration = parseFloat(document.getElementById('rec-duration').value);
  const { w, h } = parseRes(document.getElementById('rec-resolution').value);

  await ensureFontReady();

  const mime = pickMimeType();
  if (!mime) { alert('This browser does not support MediaRecorder. Use "Save PNG" instead.'); return; }

  recording = true;
  recOverlay.classList.add('active');
  recStatus.textContent = `Setting up ${w}×${h}…`;
  recBar.style.width = '0%';

  const prevPixelRatio = renderer.getPixelRatio();
  const prevLon = lon, prevLat = lat, prevFov = fov;

  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  const comp = document.createElement('canvas');
  comp.width = w; comp.height = h;
  const cctx = comp.getContext('2d');

  const stream = comp.captureStream(30);
  const recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
  const chunks = [];
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };

  const startLon = lon;
  const targetEnd = startLon + 360;
  fov = 75;
  lat = 0;
  const startFov = fov;

  let cancelled = false;
  const cancelBtn = document.getElementById('rec-cancel');
  const cancelHandler = () => { cancelled = true; };
  cancelBtn.addEventListener('click', cancelHandler, { once: true });

  const finish = () => new Promise(resolve => {
    recorder.onstop = () => {
      const ext = mime.includes('mp4') ? 'mp4' : 'webm';
      const blob = new Blob(chunks, { type: mime });
      if (!cancelled && blob.size > 0) downloadBlob(blob, ext);

      renderer.setPixelRatio(prevPixelRatio);
      resizeToWindow();
      lon = prevLon; lat = prevLat; fov = prevFov;
      targetLon = prevLon; targetLat = prevLat; targetFov = prevFov;

      recording = false;
      recOverlay.classList.remove('active');
      resolve();
    };
  });

  recorder.start();
  recStatus.textContent = `Recording ${duration}s at ${w}×${h}…`;

  const startTime = performance.now();
  const panFrame = () => {
    if (cancelled) { recorder.stop(); return; }
    const elapsed = (performance.now() - startTime) / 1000;
    const p = Math.min(1, elapsed / duration);
    const e = easeInOutCubic(p);

    lon = startLon + (targetEnd - startLon) * e;
    lat = 0;
    fov = startFov;
    camera.fov = fov; camera.updateProjectionMatrix();
    applyAngles();

    renderer.render(scene, camera);
    cctx.drawImage(renderer.domElement, 0, 0, w, h);
    drawWatermark(cctx, w, h);

    recBar.style.width = (p * 100).toFixed(1) + '%';

    if (p >= 1) { setTimeout(() => recorder.stop(), 80); return; }
    requestAnimationFrame(panFrame);
  };
  panFrame();

  await finish();
}

// ---------- Manual recording ----------
let manualRecorder = null;
let manualChunks = [];
let manualMime = '';
let manualStart = 0;
let manualTicker = null;
let manualComp = null, manualCctx = null, manualFrameLoop = false;
let manualPrev = null;

async function startManualRecording() {
  if (recording || !mesh || !canRecord) return;
  const { w, h } = parseRes(document.getElementById('rec-resolution').value);
  await ensureFontReady();
  manualMime = pickMimeType();
  if (!manualMime) { alert('This browser does not support MediaRecorder. Use "Save PNG" instead.'); return; }

  recording = true;

  manualPrev = { pixelRatio: renderer.getPixelRatio() };
  renderer.setPixelRatio(1);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();

  manualComp = document.createElement('canvas');
  manualComp.width = w; manualComp.height = h;
  manualCctx = manualComp.getContext('2d');

  const stream = manualComp.captureStream(30);
  manualChunks = [];
  manualRecorder = new MediaRecorder(stream, { mimeType: manualMime, videoBitsPerSecond: 12_000_000 });
  manualRecorder.ondataavailable = e => { if (e.data.size) manualChunks.push(e.data); };
  manualRecorder.onstop = () => {
    const ext = manualMime.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(manualChunks, { type: manualMime });
    if (blob.size > 0) downloadBlob(blob, ext);

    renderer.setPixelRatio(manualPrev.pixelRatio);
    resizeToWindow();
    recording = false;
    manualFrameLoop = false;
    recIndicator.classList.remove('active');
    clearInterval(manualTicker);
    document.getElementById('rec-manual').textContent = 'Manual rec';
    document.getElementById('rec-manual').classList.remove('danger');
  };

  manualRecorder.start();
  manualStart = performance.now();
  recIndicator.classList.add('active');
  document.getElementById('rec-manual').textContent = 'Stop & save';
  document.getElementById('rec-manual').classList.add('danger');

  manualTicker = setInterval(() => {
    const s = Math.floor((performance.now() - manualStart) / 1000);
    const mm = String(Math.floor(s / 60)).padStart(1, '0');
    const ss = String(s % 60).padStart(2, '0');
    recIndicatorText.textContent = `REC ${mm}:${ss}`;
  }, 250);

  manualFrameLoop = true;
  const loop = () => {
    if (!manualFrameLoop) return;
    tickSmoothed();
    renderer.render(scene, camera);
    manualCctx.drawImage(renderer.domElement, 0, 0, manualComp.width, manualComp.height);
    drawWatermark(manualCctx, manualComp.width, manualComp.height);
    requestAnimationFrame(loop);
  };
  loop();
}

function stopManualRecording() {
  if (manualRecorder && manualRecorder.state !== 'inactive') manualRecorder.stop();
}

function toggleManualRecording() {
  if (manualRecorder && manualRecorder.state === 'recording') stopManualRecording();
  else startManualRecording();
}

document.getElementById('rec-pan').addEventListener('click', recordPan);
document.getElementById('rec-manual').addEventListener('click', toggleManualRecording);
</script>
